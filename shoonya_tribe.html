        /* Exact Brand Palette & Typography Tokens (Ivory Light Canvas) */
        :root {
            color-scheme: light only;
            --bg-canvas: #FAF8EB;                  /* VINTAGE IVORY (Main Body Canvas) */
            --color-forest-green: #436B1D;         /* FOREST GREEN (Deep Warm Accent) */
            --color-forest-green-light: #5A8F29;
            --color-forest-green-glow: #6DA82F;
            --color-vintage-ivory: #FAF8EB;
            --color-text-dark: #1C1917;            /* DEEP OBSIDIAN BLACK */
            --color-text-muted: #57534E;            /* MUTED CHARCOAL */
            --color-gold: #C89D6B;
            --color-gold-bright: #E0BA9B;

            /* Strict Typography Hierarchy */
            --font-logo-proxima: 'Proxima Nova Black', 'Montserrat', sans-serif;
            --font-heading-aamiya: 'Aamiya Thin', 'Aamiya', 'Cormorant Garamond', serif;
            --font-subheading-gotham: 'Gotham Black', 'Gotham', 'Montserrat', sans-serif;
            --font-body-gotham: 'Gotham RND Light', 'Gotham Rounded', 'Plus Jakarta Sans', sans-serif;
            --font-micrographics: 'Doto', monospace;
            --font-title-advercase: 'Advercase', 'Cinzel', 'Playfair Display', serif;
            --font-editor-bold: 'Editor Bold', 'Editor', 'Shoonya Mono', monospace;
        }

        /* High-Fidelity Mobile OLED Wide-Gamut (P3) Color Calibration */
        @media (color-gamut: p3) {
            :root {
                --bg-canvas: color(display-p3 0.980 0.974 0.932);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html.lenis, html.lenis body {
            height: auto;
        }

        html, body {
            color-scheme: light only;
            background-color: #FAF8EB !important;
            background-color: var(--bg-canvas) !important;
            color: var(--color-text-dark);
            font-family: var(--font-body-gotham);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle Warm Film Grain (Suppressed on Mobile to prevent green subpixel tinting on AMOLED screens) */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: radial-gradient(rgba(67, 107, 29, 0.04) 1px, transparent 0);
            background-size: 26px 26px;
            pointer-events: none;
            z-index: 1;
        }
        @media (max-width: 900px) {
            body::before {
                display: none !important;
            }
        }

        /* Canvas Particle Background */
        #tribe-particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Fixed Navigation Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.25rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0.25) 70%, transparent 100%);
            transition: background 0.4s ease, border-color 0.4s ease, backdrop-filter 0.4s ease;
            opacity: 1 !important;
            transform: none !important;
            pointer-events: auto !important;
        }

        header.scrolled {
            background: rgba(250, 248, 235, 0.94) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(67, 107, 29, 0.12);
        }

        .header-top-row {
            display: contents;
        }

        .brand-logo-img {
            height: 24px;
            width: auto;
            display: block;
            filter: brightness(0) invert(1);
            transition: transform 0.2s ease, filter 0.4s ease;
        }

        header.scrolled .brand-logo-img {
            filter: none;
        }

        .brand-logo-img:hover {
            transform: scale(1.03);
        }

        .nav-links {
            position: fixed;
            top: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.75rem;
            list-style: none;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            margin: 0;
            pointer-events: auto;
        }

        .nav-links a {
            text-decoration: none;
            color: #FAF8EB;
            font-family: var(--font-editor-bold);
            font-weight: 700;
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.35rem 1.05rem;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(250, 248, 235, 0.25);
            transition: all 0.25s ease;
            display: inline-block;
            white-space: nowrap;
        }

        .nav-links a.active {
            background: rgba(230, 200, 117, 0.38) !important;
            border-color: #E6C875 !important;
            color: #FAF8EB !important;
            box-shadow: 0 0 14px rgba(230, 200, 117, 0.25);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .nav-links a:hover {
            border-color: #FAF8EB;
            color: #FAF8EB !important;
            background: rgba(0, 0, 0, 0.6);
        }

        header.scrolled .nav-links a {
            background: rgba(44, 42, 37, 0.06);
            border-color: rgba(67, 107, 29, 0.2);
            color: var(--color-text-dark);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        header.scrolled .nav-links a.active {
            background: rgba(67, 107, 29, 0.12) !important;
            border-color: var(--color-forest-green) !important;
            color: var(--color-forest-green) !important;
        }

        header.scrolled .nav-links a:hover {
            color: var(--color-forest-green) !important;
            border-color: var(--color-forest-green) !important;
        }

        .header-cta {
            border: 1.5px solid var(--color-forest-green);
            padding: 0.45rem 1.2rem;
            border-radius: 50px;
            color: var(--color-forest-green);
            font-family: var(--font-micrographics);
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
            background: transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .header-cta:hover {
            background: var(--color-forest-green);
            color: var(--color-vintage-ivory);
        }

        /* Common Container */
        .tribe-section {
            position: relative;
            z-index: 2;
            padding: 7.5rem 2rem 5rem;
            max-width: 1280px;
            margin: 0 auto;
        }

        /* -------------------------------------------------------------
           SECTION 1: SCROLL-LOCKED VIDEO HERO (21st.dev Component)
           ------------------------------------------------------------- */
        .hero-scroll-track {
            position: relative;
            height: 100vh;
            height: 100svh;
            min-height: 100vh;
            width: 100%;
            overflow: hidden;
            z-index: 10;
        }

        .hero-sticky-frame {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-video-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            background: #000;
        }

        .hero-locked-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            opacity: 1; /* 100% crystal clear natural vibrancy */
        }

        .hero-video-desktop {
            display: block;
        }

        .hero-video-mobile {
            display: none;
        }

        @media (max-width: 768px) {
            .hero-video-desktop {
                display: none !important;
            }
            .hero-video-mobile {
                display: block !important;
            }
        }

        /* Dynamic Cinematic Scrim (Starts at 0 opacity, fades in dynamically with text) */
        .hero-video-scrim {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(20, 18, 16, 0.35) 0%, rgba(20, 18, 16, 0.75) 100%);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
        }

        /* Dynamic Cinematic Bottom Vignette (Blends into #FAF8EB on exit) */
        .hero-video-vignette {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(20, 18, 16, 0.4) 0%, transparent 25%, transparent 70%, #FAF8EB 100%);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
        }

        .hero-locked-content {
            position: absolute;
            z-index: 5;
            width: 100%;
            max-width: 1200px;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .hero-stage-primary {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* Sequential entry elements starting at opacity: 0 for pure video initial view */
        .hero-kicker-pill,
        .hero-title-giant,
        .hero-subtitle-wrap {
            opacity: 0;
            will-change: transform, opacity;
        }

        .hero-manifesto-grid {
            max-width: 980px;
            width: 100%;
            margin: 0 auto;
        }

        /* Sound Capsule Toggle for Hero Video */
        .hero-sound-toggle-btn {
            position: absolute;
            bottom: 2rem;
            right: 2.5rem;
            z-index: 25;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(250, 248, 235, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid var(--color-forest-green);
            color: var(--color-forest-green);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(67, 107, 29, 0.2);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero-sound-toggle-btn:hover {
            transform: scale(1.1);
            background: var(--color-forest-green);
            color: var(--color-vintage-ivory);
            box-shadow: 0 8px 25px rgba(67, 107, 29, 0.4);
        }

        .hero-sound-toggle-btn.playing {
            background: var(--color-forest-green);
            color: var(--color-vintage-ivory);
            box-shadow: 0 0 25px rgba(67, 107, 29, 0.5);
        }

        .hero-sound-toggle-btn.playing .hero-sound-icon-muted {
            display: none;
        }

        .hero-sound-toggle-btn.playing .hero-sound-live-eq {
            display: flex;
        }

        .hero-sound-live-eq {
            display: none;
            align-items: center;
            gap: 2.5px;
            height: 14px;
        }

        .hero-eq-bar {
            width: 2.5px;
            background: currentColor;
            border-radius: 2px;
            animation: heroEqDance 0.8s ease-in-out infinite alternate;
        }
        .hero-eq-bar:nth-child(1) { height: 6px; animation-delay: 0.1s; }
        .hero-eq-bar:nth-child(2) { height: 14px; animation-delay: 0.3s; }
        .hero-eq-bar:nth-child(3) { height: 10px; animation-delay: 0.2s; }
        .hero-eq-bar:nth-child(4) { height: 8px; animation-delay: 0.4s; }

        @keyframes heroEqDance {
            0% { height: 4px; }
            100% { height: 14px; }
        }

        /* Scroll Prompt */
        .hero-scroll-prompt {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .hero-scroll-prompt span {
            font-family: var(--font-micrographics);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            color: var(--color-forest-green);
        }

        .hero-scroll-mouse {
            width: 20px;
            height: 32px;
            border: 1.5px solid var(--color-forest-green);
            border-radius: 12px;
            position: relative;
        }

        .hero-scroll-wheel {
            width: 3px;
            height: 6px;
            background: var(--color-forest-green);
            border-radius: 2px;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            animation: scrollWheelPulse 1.8s ease-in-out infinite;
        }

        @keyframes scrollWheelPulse {
            0% { transform: translate(-50%, 0); opacity: 1; }
            80% { transform: translate(-50%, 10px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 0; }
        }

        .hero-kicker-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 1.25rem;
            border-radius: 50px;
            background: rgba(28, 25, 23, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(250, 248, 235, 0.4);
            font-family: var(--font-micrographics);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: #FAF8EB;
            margin-bottom: 1.8rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* Master Title: T R I B E in Doto with Shoonya Blob Glyph (Desktop Grand Spacing) */
        .tribe-title-text {
            font-family: 'Doto', sans-serif;
            font-size: clamp(3rem, 6.5vw, 5.5rem);
            font-weight: 900;
            color: #FAF8EB;
            margin-bottom: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: clamp(1.2rem, 3.5vw, 3.2rem);
            letter-spacing: 0.16em;
            text-indent: 0.16em;
            max-width: 100%;
            text-shadow: 0 4px 28px rgba(0, 0, 0, 0.8), 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .tribe-logo-glyph-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            margin: 0 0.15em;
        }

        .tribe-title-blob-logo {
            width: 0.85em;
            height: 0.85em;
            color: #FAF8EB;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.8));
            animation: tribeBlobPulse 4s ease-in-out infinite alternate;
        }

        @keyframes tribeBlobPulse {
            0% { transform: scale(0.96); filter: drop-shadow(0 0 10px rgba(250, 248, 235, 0.4)); }
            100% { transform: scale(1.04); filter: drop-shadow(0 0 24px rgba(250, 248, 235, 0.8)); }
        }

        /* -------------------------------------------------------------
           SECTION 4: JOIN THE CIRCLE (GIANT MOVING SHOONYA BLOB)
           ------------------------------------------------------------- */
        .portal-section {
            position: relative;

            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;

        .portal-blob-container {
            position: relative;

            align-items: center;
            justify-content: center;

        /* Giant Moving Shoonya Blob Vector Layer */
        .portal-blob-shape-wrap {
            position: absolute;
            inset: -40px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
            animation: portalBlobFloat 12s ease-in-out infinite alternate;
        }

        .portal-blob-svg {
            width: 100%;
            height: 100%;
            color: rgba(67, 107, 29, 0.09);
            fill: currentColor;
            filter: drop-shadow(0 25px 60px rgba(67, 107, 29, 0.22));
            transition: all 0.5s ease;
        }

        .portal-blob-glow {
            position: absolute;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(67, 107, 29, 0.18) 0%, transparent 70%);
            filter: blur(40px);
            z-index: -1;
        }

        @keyframes portalBlobFloat {
            0% { transform: scale(0.96) rotate(-1.5deg) translateY(0); }
            50% { transform: scale(1.04) rotate(1.8deg) translateY(-14px); }
            100% { transform: scale(0.98) rotate(-1deg) translateY(10px); }
        }

        .portal-blob-container:hover .portal-blob-shape-wrap {
            animation-duration: 7s;
        }

        .portal-blob-container:hover .portal-blob-svg {
            color: rgba(67, 107, 29, 0.13);
            filter: drop-shadow(0 30px 80px rgba(67, 107, 29, 0.3));

        /* =========================================================
           TANYA SYNC: SHUNYAGAR INTRO, SACRED TRIAD & PAST EVENTS
           ========================================================= */
        
        /* =========================================================
           SECTION 2: SHUNYAGAR DRAMATIC CINEMATIC SEQUENCE
           ========================================================= */
        .shunyagar-intro-section {
            position: relative;
            padding: 5rem 2rem 5rem;
            text-align: center;
            max-width: 1120px;
            margin: 0 auto;
            min-height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1400px;
        }

        .shunyagar-cinematic-theater {
            position: relative;
            width: 100%;
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Burst Stage (Acts 1 & 2) */
        .shunyagar-burst-stage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }

        .cinematic-word-layer {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(2.8) translateY(25px);
            filter: blur(14px);
            will-change: transform, opacity, filter;
            pointer-events: none;
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cinematic-word-layer.active-fly-in {
            opacity: 1;
            transform: scale(1) translateY(0);
            filter: blur(0px);
        }

        .cinematic-word-layer.active-exit {
            opacity: 0;
            transform: scale(0.88) translateY(-20px);
            filter: blur(8px);
        }

        .cinematic-word-layer.bursting {
            opacity: 0;
            transform: scale(2.4);
            filter: blur(18px);
            transition: transform 0.45s ease-out, opacity 0.45s ease-out, filter 0.45s ease-out;
        }

        /* Typography Styles for Dramatic Words */
        .burst-micro-kicker {
            font-family: var(--font-micrographics);
            font-size: 0.82rem;
            letter-spacing: 0.25em;
            color: var(--color-forest-green);
            margin-bottom: 0.6rem;
            font-weight: 700;
        }

        .burst-glyph-title {
            font-family: var(--font-title-advercase);
            font-size: clamp(2.8rem, 7.5vw, 5.8rem);
            letter-spacing: 0.12em;
            color: var(--color-forest-green);
            line-height: 1.05;
            text-shadow: 0 4px 30px rgba(67, 107, 29, 0.18);
        }

        .burst-devanagari-ancient {
            font-family: var(--font-heading-aamiya);
            font-size: clamp(3.2rem, 8.5vw, 6.2rem);
            color: var(--color-gold);
            line-height: 1;
            letter-spacing: 0.08em;
            text-shadow: 0 4px 30px rgba(200, 157, 107, 0.3);
        }

        .burst-latin-sub {
            font-family: var(--font-subheading-gotham);
            font-size: clamp(0.95rem, 2vw, 1.3rem);
            letter-spacing: 0.32em;
            color: var(--color-text-dark);
            margin-top: 0.6rem;
            font-weight: 900;
        }

        .home-burst-cluster {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
        }

        .home-glyph-hindi {
            font-family: var(--font-heading-aamiya);
            font-size: clamp(4.8rem, 12vw, 8.8rem);
            font-weight: 700;
            color: var(--color-forest-green);
            line-height: 1;
            text-shadow: 0 6px 35px rgba(67, 107, 29, 0.25);
        }

        .home-glyph-en {
            font-family: var(--font-subheading-gotham);
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 0.4em;
            color: var(--color-gold);
        }

        /* Shockwave & Flash */
        .shunyagar-shockwave-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 240px;
            height: 240px;
            margin-top: -120px;
            margin-left: -120px;
            border-radius: 50%;
            border: 2.5px solid var(--color-gold);
            box-shadow: 0 0 40px rgba(200, 157, 107, 0.7), inset 0 0 25px rgba(67, 107, 29, 0.4);
            opacity: 0;
            transform: scale(0.1);
            pointer-events: none;
            z-index: 5;
        }

        .shunyagar-shockwave-ring.trigger-shockwave {
            animation: shunyagarShockwaveAnim 0.75s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes shunyagarShockwaveAnim {
            0% {
                opacity: 0.95;
                transform: scale(0.2);
            }
            60% {
                opacity: 0.7;
            }
            100% {
                opacity: 0;
                transform: scale(3.4);
                border-width: 1px;
            }
        }

        .shunyagar-light-flash {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 320px;
            margin-top: -160px;
            margin-left: -160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 157, 107, 0.5) 0%, rgba(67, 107, 29, 0.22) 50%, transparent 75%);
            opacity: 0;
            transform: scale(0.4);
            pointer-events: none;
            z-index: 4;
        }

        .shunyagar-light-flash.trigger-flash {
            animation: shunyagarFlashAnim 0.65s ease-out forwards;
        }

        @keyframes shunyagarFlashAnim {
            0% {
                opacity: 0;
                transform: scale(0.4);
            }
            30% {
                opacity: 0.88;
                transform: scale(1.4);
            }
            100% {
                opacity: 0;
                transform: scale(2.5);
            }
        }

        /* Manifesto Stage (Act 3) */
        .shunyagar-manifesto-stage {
            width: 100%;
            opacity: 0;
            transform: scale(0.94) translateY(30px);
            filter: blur(10px);
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 2;
        }

        .shunyagar-manifesto-stage.revealed {
            opacity: 1;
            transform: scale(1) translateY(0);
            filter: blur(0px);
            pointer-events: auto;
        }

        .shunyagar-intro-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1.5px solid rgba(67, 107, 29, 0.24);
            border-radius: 28px;
            padding: 3.5rem 3.5rem 3rem;
            box-shadow: 0 20px 50px rgba(67, 107, 29, 0.08), 0 2px 10px rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(18px);
            position: relative;
            overflow: hidden;
        }

        /* Cursor-tracking Specular Light Sheen */
        .shunyagar-specular-sheen {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease;
            background: radial-gradient(circle 380px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.72), rgba(200, 157, 107, 0.10) 50%, transparent 80%);
            z-index: 10;
        }

        .shunyagar-intro-card:hover .shunyagar-specular-sheen {
            opacity: 1;
        }

        .shunyagar-intro-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--color-forest-green), transparent);
            border-radius: 2px;
        }

        .shunyagar-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .shunyagar-actions-wrap {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .shunyagar-replay-btn {
            background: rgba(200, 157, 107, 0.12);
            border: 1px solid rgba(200, 157, 107, 0.35);
            color: var(--color-text-dark);
            font-family: var(--font-micrographics);
            font-size: 0.65rem;
            font-weight: 700;

        /* Section 3: The Sacred Triad of Shunyagar */
        .sacred-triad-section {
            position: relative;
            padding: 5rem 2rem 6rem;
            max-width: 1240px;
            margin: 0 auto;
            z-index: 2;
        }

        .triad-grid {

        .triad-card {

        .triad-card::after {

            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            transition: opacity 0.3s ease;
            opacity: 0.85;
        }

        .triad-card.card-kaya::after { background: #8C502E; }
        .triad-card.card-prana::after { background: #436B1D; }
        .triad-card.card-jnana::after { background: #1E3A8A; }

        .triad-card:hover {
            transform: translateY(-6px);
            border-color: rgba(67, 107, 29, 0.4);

        .triad-top-badge {
            display: flex;
            justify-content: space-between;

            margin-bottom: 1.25rem;

        .triad-number {

            font-size: 0.72rem;

        .triad-pill-label {
            font-family: var(--font-subheading-gotham);

            font-weight: 900;
            letter-spacing: 0.1em;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;

        .card-kaya .triad-pill-label { background: rgba(140, 80, 46, 0.12); color: #8C502E; }
        .card-prana .triad-pill-label { background: rgba(67, 107, 29, 0.12); color: #436B1D; }
        .card-jnana .triad-pill-label { background: rgba(30, 58, 138, 0.12); color: #1E3A8A; }

        .triad-title {
            font-family: var(--font-heading-cinzel);
            font-size: 1.6rem;

            letter-spacing: 0.05em;

        .triad-sub {

        .triad-body {

        .triad-elements-list {

        /* =========================================================
           SECTION 4: CHRONOLOGICAL DEEP DIVE TIMELINE (ANIMATED LIKE SHUNYAGAR)
           ========================================================= */
        .past-events-section {
            position: relative;
            padding: 6rem 2rem 6.5rem;
            max-width: 1180px;
            margin: 0 auto;
            z-index: 2;
            perspective: 1400px;
        }

        /* Timeline Navigation Console */
        .events-timeline-console {
            position: relative;
            max-width: 980px;
            margin: 2.5rem auto 3rem;
            padding: 0 1rem;
        }

        .events-timeline-track {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 2px;
            background: rgba(67, 107, 29, 0.15);
            transform: translateY(-50%);
            z-index: 1;
        }

        .events-timeline-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1E3A8A, #436B1D, #8C502E);
            transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .events-timeline-nodes {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .timeline-node-pill {
            background: rgba(255, 255, 255, 0.94);
            border: 1.5px solid rgba(67, 107, 29, 0.22);
            border-radius: 24px;
            padding: 0.6rem 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .timeline-node-pill:hover {
            transform: translateY(-2px);
            border-color: var(--color-forest-green);
            box-shadow: 0 8px 25px rgba(67, 107, 29, 0.12);
        }

        .timeline-node-pill.active {
            background: #FFFFFF;
            transform: scale(1.04) translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .timeline-node-pill.active[data-index="0"] { border-color: #1E3A8A; }
        .timeline-node-pill.active[data-index="1"] { border-color: #436B1D; }
        .timeline-node-pill.active[data-index="2"] { border-color: #8C502E; }

        .node-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .timeline-node-pill.active .node-dot {
            transform: scale(1.35);
        }

        .dot-jnana { background: #1E3A8A; box-shadow: 0 0 10px rgba(30, 58, 138, 0.5); }
        .dot-prana { background: #436B1D; box-shadow: 0 0 10px rgba(67, 107, 29, 0.5); }
        .dot-kaya { background: #8C502E; box-shadow: 0 0 10px rgba(140, 80, 46, 0.5); }

        .node-pillar-tag {
            font-family: var(--font-micrographics);
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: var(--color-text-muted);
        }

        .timeline-node-pill.active[data-index="0"] .node-pillar-tag { color: #1E3A8A; }
        .timeline-node-pill.active[data-index="1"] .node-pillar-tag { color: #436B1D; }
        .timeline-node-pill.active[data-index="2"] .node-pillar-tag { color: #8C502E; }

        .node-name {
            font-family: var(--font-subheading-gotham);
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--color-text-dark);
            letter-spacing: 0.04em;
        }

        /* Past Events Cinematic Theater Stage */
        .past-events-theater {
            position: relative;
            width: 100%;
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        /* Burst Stage for Events */
        .events-burst-stage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }

        .events-word-layer {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(2.6) translateY(25px);
            filter: blur(14px);
            will-change: transform, opacity, filter;
            pointer-events: none;
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .events-word-layer.active-fly-in {
            opacity: 1;
            transform: scale(1) translateY(0);
            filter: blur(0px);
        }

        .events-word-layer.active-exit {
            opacity: 0;
            transform: scale(0.88) translateY(-20px);
            filter: blur(8px);
        }

        .events-word-layer.bursting {
            opacity: 0;
            transform: scale(2.4);
            filter: blur(18px);
            transition: transform 0.45s ease-out, opacity 0.45s ease-out, filter 0.45s ease-out;
        }

        .events-burst-kicker {
            font-family: var(--font-micrographics);
            font-size: 0.82rem;
            letter-spacing: 0.25em;
            color: var(--color-gold);
            margin-bottom: 0.6rem;
            font-weight: 700;
        }

        .events-burst-title {
            font-family: var(--font-title-advercase);
            font-size: clamp(2.4rem, 6.5vw, 5.2rem);
            letter-spacing: 0.1em;
            line-height: 1.1;
            text-align: center;
            color: var(--color-forest-green);
            text-shadow: 0 4px 30px rgba(67, 107, 29, 0.18);
        }

        .events-burst-title.theme-jnana { color: #1E3A8A; text-shadow: 0 4px 30px rgba(30, 58, 138, 0.25); }
        .events-burst-title.theme-prana { color: #436B1D; text-shadow: 0 4px 30px rgba(67, 107, 29, 0.25); }
        .events-burst-title.theme-kaya { color: #8C502E; text-shadow: 0 4px 30px rgba(140, 80, 46, 0.25); }

        .events-burst-sub {
            font-family: var(--font-heading-aamiya);
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--color-gold);
            line-height: 1.1;
            letter-spacing: 0.08em;
        }

        .events-burst-anchor {
            font-family: var(--font-subheading-gotham);
            font-size: clamp(1.1rem, 2.5vw, 1.8rem);
            letter-spacing: 0.25em;
            font-weight: 900;
            color: var(--color-text-dark);
            margin-top: 0.4rem;
        }

        /* Shockwave & Flash for Events */
        .events-shockwave-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 240px;
            height: 240px;
            margin-top: -120px;
            margin-left: -120px;
            border-radius: 50%;
            border: 2.5px solid var(--color-gold);
            box-shadow: 0 0 40px rgba(200, 157, 107, 0.7);
            opacity: 0;
            transform: scale(0.1);
            pointer-events: none;
            z-index: 5;
        }

        .events-shockwave-ring.trigger-shockwave {
            animation: eventsShockwaveAnim 0.75s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes eventsShockwaveAnim {
            0% { opacity: 0.95; transform: scale(0.2); }
            60% { opacity: 0.7; }
            100% { opacity: 0; transform: scale(3.4); border-width: 1px; }
        }

        .events-light-flash {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 320px;
            margin-top: -160px;
            margin-left: -160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 157, 107, 0.5) 0%, rgba(67, 107, 29, 0.2) 50%, transparent 75%);
            opacity: 0;
            transform: scale(0.4);
            pointer-events: none;
            z-index: 4;
        }

        .events-light-flash.trigger-flash {
            animation: eventsFlashAnim 0.65s ease-out forwards;
        }

        @keyframes eventsFlashAnim {
            0% { opacity: 0; transform: scale(0.4); }
            30% { opacity: 0.88; transform: scale(1.4); }
            100% { opacity: 0; transform: scale(2.5); }
        }

        /* Revealed Deep Dive Card Stage */
        .events-manifesto-stage {
            width: 100%;
            opacity: 0;
            transform: scale(0.94) translateY(30px);
            filter: blur(10px);
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 2;
        }

        .events-manifesto-stage.revealed {
            opacity: 1;
            transform: scale(1) translateY(0);
            filter: blur(0px);
            pointer-events: auto;
        }

        .events-deepdive-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1.5px solid rgba(67, 107, 29, 0.24);
            border-radius: 28px;
            padding: 3.25rem 3.25rem 2.75rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(18px);
            position: relative;
            overflow: hidden;
            text-align: left;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .events-deepdive-card.theme-jnana {
            border-color: rgba(30, 58, 138, 0.35);
            box-shadow: 0 24px 60px rgba(30, 58, 138, 0.10);
        }
        .events-deepdive-card.theme-prana {
            border-color: rgba(67, 107, 29, 0.35);
            box-shadow: 0 24px 60px rgba(67, 107, 29, 0.10);
        }
        .events-deepdive-card.theme-kaya {
            border-color: rgba(140, 80, 46, 0.35);
            box-shadow: 0 24px 60px rgba(140, 80, 46, 0.10);
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .event-pillar-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: var(--font-micrographics);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            padding: 0.3rem 0.75rem;
            border-radius: 16px;
            text-transform: uppercase;
            width: fit-content;
        }

        .badge-jnana { background: rgba(30, 58, 138, 0.1); color: #1E3A8A; border: 1px solid rgba(30, 58, 138, 0.2); }
        .badge-prana { background: rgba(67, 107, 29, 0.1); color: #436B1D; border: 1px solid rgba(67, 107, 29, 0.2); }
        .badge-kaya { background: rgba(140, 80, 46, 0.1); color: #8C502E; border: 1px solid rgba(140, 80, 46, 0.2); }

        .event-card-title {
            font-family: var(--font-heading-cinzel);
            font-size: clamp(1.4rem, 2.5vw, 2.1rem);
            color: var(--color-text-dark);
            line-height: 1.3;
            margin-bottom: 0.75rem;
            font-weight: 700;

        .event-card-setting {
            font-family: var(--font-micrographics);
            font-size: 0.8rem;

        .events-highlights-grid {

            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1.8rem;
        }

        .highlight-chip {
            background: rgba(250, 248, 235, 0.85);
            border: 1px solid rgba(67, 107, 29, 0.18);
            border-radius: 20px;
            padding: 0.4rem 0.9rem;
            font-family: var(--font-micrographics);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--color-text-dark);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);

        .highlight-chip:hover {

        .event-quote-highlight {
            font-family: var(--font-serif-cormorant);

        /* Navigation Controls Bar */
        .events-nav-controls {

        .events-replay-pill {

        /* Section 7: Community Reviews Wall (Second-to-last) */

            position: relative;
            padding: 6rem 2rem 5rem;
            max-width: 1240px;
            margin: 0 auto;
            z-index: 2;
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.75rem;
            margin-top: 3rem;
        }

        .review-card {

    <!-- Interactive Script -->
    <script>
        function id(name) { return document.getElementById(name); }

        // 1. Lenis Smooth Scroll
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            orientation: 'vertical',
            smoothWheel: true,
            wheelMultiplier: 0.95
        });

        function lenisRaf(time) {
            lenis.raf(time);
            requestAnimationFrame(lenisRaf);
        }
        requestAnimationFrame(lenisRaf);

        // =========================================================
        // HEADER & HERO VIDEO PLAYBACK CONTROLLER
        // =========================================================
        const heroTrack = id('tribe-hero-track');
        const heroVideoWrapper = id('hero-video-wrapper');
        const heroHeader = document.querySelector('header');
        const heroVideoDesktop = id('hero-video-desktop');
        const heroVideoMobile = id('hero-video-mobile');
        function getHeroVideo() {
            return (window.innerWidth <= 768) ? (heroVideoMobile || heroVideoDesktop) : (heroVideoDesktop || heroVideoMobile);
        }
        const heroSoundBtn = id('hero-sound-toggle');
        let isHeroInViewport = true;

        // Header Scrolled Glass Transition (Ivory Glass on scroll)
        window.addEventListener('scroll', () => {
            if (heroHeader) {
                if (window.scrollY > 40) {
                    heroHeader.classList.add('scrolled');
                } else {
                    heroHeader.classList.remove('scrolled');
                }
            }
        }, { passive: true });

        // Guaranteed Video Playback Engine (Desktop IMG_1397 & Mobile IMG_1398)
        function ensureHeroVideoPlayback() {
            [heroVideoDesktop, heroVideoMobile].forEach((v) => {
                if (!v) return;
                v.muted = true;
                v.defaultMuted = true;
                v.loop = true;
                v.playsInline = true;
                v.setAttribute('playsinline', '');
                v.setAttribute('muted', '');
                v.setAttribute('loop', '');
            });

            const tryPlay = () => {
                const activeV = getHeroVideo();
                if (activeV && activeV.paused) {
                    activeV.muted = true;
                    activeV.play().catch(() => {});
                }
            };

            [heroVideoDesktop, heroVideoMobile].forEach((v) => {
                if (!v) return;
                v.addEventListener('ended', () => {
                    v.currentTime = 0;
                    v.play().catch(() => {});
                });
                v.addEventListener('timeupdate', () => {
                    if (v.duration && v.currentTime >= (v.duration - 0.25)) {
                        v.currentTime = 0;
                        v.play().catch(() => {});
                    }
                });
                v.addEventListener('pause', () => {
                    if (!document.hidden && isHeroInViewport && (v === getHeroVideo())) {
                        setTimeout(tryPlay, 60);
                    }
                });
            });

            // Liveness watchdog
            setInterval(() => {
                const activeV = getHeroVideo();
                if (!document.hidden && isHeroInViewport && activeV && activeV.paused) {
                    tryPlay();
                }
            }, 1000);

            tryPlay();

            if (heroVideoWrapper) {
                heroVideoWrapper.addEventListener('click', tryPlay);
            }
            if (heroTrack) {
                heroTrack.addEventListener('click', tryPlay);
            }

            ['pointerdown', 'scroll', 'touchstart', 'mousemove', 'keydown'].forEach(evt => {
                window.addEventListener(evt, tryPlay, { once: true, passive: true });
            });
        }
        ensureHeroVideoPlayback();
        document.addEventListener('DOMContentLoaded', ensureHeroVideoPlayback);
        window.addEventListener('load', ensureHeroVideoPlayback);

        // Smart Intersection Observer for Hero Video (Saves GPU decoding when scrolled to Portal)
        if ('IntersectionObserver' in window && heroTrack) {
            const heroObs = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    isHeroInViewport = entry.isIntersecting;
                    const activeVid = getHeroVideo();
                    if (!isHeroInViewport) {
                        if (activeVid && !activeVid.paused) activeVid.pause();
                    } else {
                        if (activeVid && activeVid.paused) activeVid.play().catch(() => {});
                    }
                });
            }, { threshold: 0.05 });
            heroObs.observe(heroTrack);
        }

        // Sound & Autoplay Engine for Hero Video & Ambient Audio
        const heroAudio = id('hero-ambient-audio');
        let heroAudioUserMuted = false;

        function setHeroSoundState(isPlaying) {
            if (!heroSoundBtn) return;
            if (isPlaying) {
                heroSoundBtn.classList.add('playing');
                heroSoundBtn.title = 'Mute Sound';
            } else {
                heroSoundBtn.classList.remove('playing');
                heroSoundBtn.title = 'Play Sound';
            }
        }
        setHeroSoundState(true);

        function playHeroAudioInstant() {
            if (heroAudioUserMuted || !heroAudio) return;
            setHeroSoundState(true);
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                try {
                    if (!window._shoonyaAudioCtx) {
                        window._shoonyaAudioCtx = new AudioCtx();
                    }
                    if (window._shoonyaAudioCtx.state === 'suspended') {
                        window._shoonyaAudioCtx.resume().catch(()=>{});
                    }
                } catch(e) {}
            }
            heroAudio.volume = 1.0;
            heroAudio.muted = false;
            heroAudio.play().then(() => {
                setHeroSoundState(true);
            }).catch(() => {
                // If browser blocks unmuted audio on cold load, stream muted in background
                heroAudio.muted = true;
                heroAudio.play().catch(()=>{});
                setHeroSoundState(true);
            });
        }

        if (heroSoundBtn) {
            heroSoundBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!heroAudio) return;
                if (heroAudio.paused || heroAudio.muted) {
                    heroAudioUserMuted = false;
                    heroAudio.muted = false;
                    playHeroAudioInstant();
                } else {
                    heroAudioUserMuted = true;
                    heroAudio.pause();
                    setHeroSoundState(false);
                }
            });
        }

        playHeroAudioInstant();
        document.addEventListener('DOMContentLoaded', playHeroAudioInstant);
        window.addEventListener('load', playHeroAudioInstant);
        window.addEventListener('pageshow', playHeroAudioInstant);

        let tribeAutoplayRetries = 0;
        const tribeAutoplayInterval = setInterval(() => {
            tribeAutoplayRetries++;
            const activeVid = getHeroVideo();
            if (activeVid && activeVid.paused) activeVid.play().catch(()=>{});
            if (!heroAudioUserMuted) playHeroAudioInstant();
            if ((heroAudio && !heroAudio.paused && !heroAudio.muted) || tribeAutoplayRetries > 30) {
                clearInterval(tribeAutoplayInterval);
            }
        }, 150);
        setTimeout(() => clearInterval(tribeAutoplayInterval), 6000);

        const onTribeInstantSignal = () => {
            const activeVid = getHeroVideo();
            if (activeVid && activeVid.paused) activeVid.play().catch(()=>{});
            if (!heroAudioUserMuted && heroAudio) {
                if (window._shoonyaAudioCtx && window._shoonyaAudioCtx.state === 'suspended') {
                    window._shoonyaAudioCtx.resume().catch(()=>{});
                }
                heroAudio.muted = false;
                heroAudio.volume = 1.0;
                if (heroAudio.paused) {
                    heroAudio.play().then(() => setHeroSoundState(true)).catch(()=>{});
                } else {
                    setHeroSoundState(true);
                }
            }
        };
        ['touchstart', 'touchend', 'touchmove', 'pointerdown', 'pointerup', 'pointermove', 'pointerenter', 'mousemove', 'mouseenter', 'scroll', 'wheel', 'click', 'keydown', 'mousedown', 'mouseup', 'focus', 'pageshow'].forEach(evt => {
            window.addEventListener(evt, onTribeInstantSignal, { passive: true, capture: true });
            document.addEventListener(evt, onTribeInstantSignal, { passive: true, capture: true });
        });
    
    </script>
